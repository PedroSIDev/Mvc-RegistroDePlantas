services:

  mysql:
    image: mysql:8.4
    container_name: mvc-java-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mvcplantas
      MYSQL_USER: mvc_user
      MYSQL_PASSWORD: mvc123

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  tomcat:
    image: tomcat:10.1-jdk21
    container_name: mvc-java-tomcat

    environment:
      DB_HOST: mysql
      DB_USER: mvc_user
      DB_PASSWORD: mvc123

    ports:
      - "8080:8080"

    volumes:
      - ./deploy:/usr/local/tomcat/webapps

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: